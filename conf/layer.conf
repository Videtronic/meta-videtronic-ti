# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-videtronic-ti"
BBFILE_PATTERN_meta-videtronic-ti = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-videtronic-ti = "6"

LAYERDEPENDS_meta-videtronic-ti = " \
  core \
  toradex-ti-layer\
  toradex-demos \
  meta-toradex-distro \
  toradex-bsp-common-layer \
"

LAYERSERIES_COMPAT_meta-videtronic-ti = "scarthgap"